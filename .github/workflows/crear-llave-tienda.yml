name: Crear Llave Maestra y Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Descomprimir ZIP mas reciente
        run: |
          if [ -f "package.json" ]; then
            echo "APP_DIR=." >> "$GITHUB_ENV"
          else
            ZIP_FILE="$(for f in *.zip; do [ -f "$f" ] && printf '%s\t%s\n' "$(git log -1 --format=%ct -- "$f")" "$f"; done | sort -nr | head -n 1 | cut -f2-)"
            rm -rf _app_src
            mkdir -p _app_src
            unzip -oq "$ZIP_FILE" -d _app_src
            PKG_PATH="$(find _app_src -maxdepth 3 -name 'package.json' | head -n 1)"
            echo "APP_DIR=$(dirname "$PKG_PATH")" >> "$GITHUB_ENV"
          fi

      - name: Compilar app web
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Empaquetar Android
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android
          python3 android-native/setup-android.py

      - name: Generar llave y compilar Release + Play Store
        working-directory: ${{ env.APP_DIR }}/android
        env:
          KEY_PASS: ${{ secrets.HUYIN_KEY_PASS }}
        run: |
          if [ -z "$KEY_PASS" ] || [ ${#KEY_PASS} -lt 6 ]; then
            echo "ERROR: Crea primero el secreto HUYIN_KEY_PASS (minimo 6 caracteres) en Settings -> Secrets -> Actions."
            exit 1
          fi
          keytool -genkeypair -v \
            -keystore /tmp/huyin-release.jks \
            -alias huyin \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEY_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=Huyin Reproductor, OU=Mobile, O=ffsemsi-lab, L=Ciudad, S=Estado, C=ES"
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file=/tmp/huyin-release.jks \
            -Pandroid.injected.signing.store.password="$KEY_PASS" \
            -Pandroid.injected.signing.key.alias=huyin \
            -Pandroid.injected.signing.key.password="$KEY_PASS"
          mkdir -p /tmp/llave_out
          cp /tmp/huyin-release.jks /tmp/llave_out/
          command -v zip >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq zip)
          zip -j -P "$KEY_PASS" /tmp/huyin-llave-segura.zip /tmp/llave_out/huyin-release.jks

      - name: Guardar llave segura (descarga y borra de GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: Llave-Secreta-Huyin
          path: /tmp/huyin-llave-segura.zip
          retention-days: 1

      - name: Guardar APK Release y AAB Play Store
        uses: actions/upload-artifact@v4
        with:
          name: Huyin-Tienda-Release
          path: |
            ${{ env.APP_DIR }}/android/app/build/outputs/apk/release/app-release.apk
            ${{ env.APP_DIR }}/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
