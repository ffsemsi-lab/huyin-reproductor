name: Fabricar APK Nuevo

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Descomprimir proyecto si viene en ZIP
        run: |
          if [ -f "package.json" ]; then
            echo "APP_DIR=." >> "$GITHUB_ENV"
          else
            ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"
            if [ -z "$ZIP_FILE" ]; then
              echo "No se encontro archivo .zip"
              exit 1
            fi
            rm -rf _app_src
            mkdir -p _app_src
            unzip -oq "$ZIP_FILE" -d _app_src
            PKG_PATH="$(find _app_src -maxdepth 3 -name 'package.json' | head -n 1)"
            if [ -z "$PKG_PATH" ]; then
              echo "No se encontro package.json"
              exit 1
            fi
            echo "APP_DIR=$(dirname "$PKG_PATH")" >> "$GITHUB_ENV"
          fi

      - name: Instalar y compilar app web
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Empaquetar en Android con Capacitor
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            npx cap init "Huyin" "com.huyin.reproductor" --web-dir dist
          fi
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Aplicar icono de la app
        working-directory: ${{ env.APP_DIR }}
        run: |
          if [ -f public/pwa-512x512.png ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              dir="android/app/src/main/res/$d"
              if [ -d "$dir" ]; then
                cp public/pwa-512x512.png "$dir/ic_launcher.png"
                cp public/pwa-512x512.png "$dir/ic_launcher_round.png"
              fi
            done
          fi

      - name: Fabricar APK
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Huyin-APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
