name: Fabricar APK v4

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Descomprimir ZIP mas reciente
        run: |
          NEWEST_ZIP="$(for f in *.zip; do [ -f "$f" ] && printf '%s\t%s\n' "$(git log -1 --format=%ct -- "$f")" "$f"; done | sort -nr | head -n 1 | cut -f2-)"
          ZIP_TS=0
          PKG_TS=0
          if [ -n "$NEWEST_ZIP" ]; then
            ZIP_TS="$(git log -1 --format=%ct -- "$NEWEST_ZIP")"
          fi
          if [ -f "package.json" ]; then
            PKG_TS="$(git log -1 --format=%ct -- package.json)"
          fi

          if [ -n "$NEWEST_ZIP" ] && { [ ! -f "package.json" ] || [ "$ZIP_TS" -ge "$PKG_TS" ]; }; then
            echo "Usando ZIP: $NEWEST_ZIP"
            rm -rf _app_src
            mkdir -p _app_src
            unzip -oq "$NEWEST_ZIP" -d _app_src
            PKG_PATH="$(find _app_src -maxdepth 3 -name 'package.json' | head -n 1)"
            echo "APP_DIR=$(dirname "$PKG_PATH")" >> "$GITHUB_ENV"
          else
            echo "APP_DIR=." >> "$GITHUB_ENV"
          fi

      - name: Compilar app web
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Empaquetar Android
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android
          python3 android-native/setup-android.py

      - name: Fabricar APK
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Huyin-APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
